<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Matches --bg in index.css; Header.jsx rewrites it when the theme flips. -->
    <meta name="theme-color" content="#11110f" />
    <!-- Pixel K on a coin-gold tile, same glyph as the cabinet's side art. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9' shape-rendering='crispEdges'%3E%3Crect width='9' height='9' fill='%23ffc629'/%3E%3Cpath fill='%23141209' d='M2 1h1v7H2zM6 1h1v1H6zM5 2h1v1H5zM4 3h1v1H4zM3 4h1v1H3zM4 5h1v1H4zM5 6h1v1H5zM6 7h1v1H6z'/%3E%3C/svg%3E"
    />

    <title>Gurram Naga Kumaraswamy — Full-stack engineer</title>
    <meta
      name="description"
      content="Final-year CS student at IIIT Sri City, graduating May 2027. Full-stack engineer — two shipped internship platforms, plus benchmarked work on LLM agent security and concurrency."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gurram Naga Kumaraswamy — Full-stack engineer" />
    <meta
      property="og:description"
      content="I build full-stack platforms, and I spend a lot of time trying to break the ones I build."
    />
    <meta property="og:url" content="https://kumaraswamyportfolio.vercel.app" />
    <meta property="og:image" content="https://kumaraswamyportfolio.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://kumaraswamyportfolio.vercel.app" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Jersey+10&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve the theme before first paint so there is no flash. Night is
         the identity; only an explicit choice made here switches to day. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
